<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Notion Math Editor</title><meta name="description" content="离线可视化高等数学公式编辑器，点击构建公式，复制到 Notion。"></head>
<body><main class="app">
  <header class="app-header"><div class="brand-mark" aria-hidden="true">ƒ</div><div class="brand"><h1>Notion Math Editor</h1><p>让公式输入，像思考一样自然。</p></div><span class="offline-badge"><i></i>离线可用</span></header>
  <nav class="toolbar" aria-label="编辑工具"><div class="toolbar-group"><button id="undo" title="撤销 Ctrl+Z" disabled><span aria-hidden="true">↶</span> 撤销</button><button id="redo" title="重做 Ctrl+Shift+Z" disabled><span aria-hidden="true">↷</span> 重做</button><span class="divider"></span><button id="clear" disabled>清空</button></div><div class="toolbar-group"><button id="open-import"><span aria-hidden="true">↓</span> 导入 LaTeX</button><button id="copy-top" class="primary" disabled>复制 LaTeX <span aria-hidden="true">↗</span></button></div></nav>
  <section class="symbol-panel" aria-label="数学符号面板"><div id="categories" role="tablist" aria-label="符号分类"></div><div class="panel-caption"><span id="category-description"></span><span>拖入公式或空位 · 也可点击</span></div><div id="symbols" role="tabpanel"></div><div class="building-blocks"><span>基础积木</span><div id="building-blocks" aria-label="变量与数字积木"></div></div></section>
  <section class="editor-section" aria-labelledby="editor-title"><div class="section-heading"><h2 id="editor-title"><span class="step">01</span> 可视化编辑</h2><button id="move-selection" class="selection-grip" disabled title="先用鼠标选中公式，再拖动此按钮移动选中部分">⠿ 拖动选中部分</button></div><div class="editor-surface"><div id="mathfield-host"></div><div class="editor-bottom"><span><span class="key">Tab</span> 下一个空位 · <span class="key">Esc</span> 取消拖放</span><span id="editor-state">等待输入</span></div></div><p id="drag-status" class="drag-status" role="status">把上方积木拖入公式区，绿色标记会指示放置位置。</p><div class="quick-row"><span>试一试</span><button data-example="limit">经典极限</button><button data-example="integral">定积分</button><button data-example="matrix">矩阵</button><button id="next-slot" title="跳到下一个占位符">下一个空位 →</button></div></section>
  <section class="export-section" aria-labelledby="export-title"><div class="section-heading"><h2 id="export-title"><span class="step">02</span> LaTeX 输出</h2><span class="small-label">粘贴到 Notion 公式块</span></div><div class="source-wrap"><label class="sr-only" for="latex-output">LaTeX 输出</label><textarea id="latex-output" readonly spellcheck="false" placeholder="你的 LaTeX 会实时显示在这里…"></textarea><button id="copy-output" title="复制 LaTeX" disabled>复制</button></div><p id="validation" class="validation" aria-live="polite">公式为空。选择一个符号或模板开始。</p></section>
  <section id="import-panel" class="import-panel" aria-labelledby="import-title" hidden><div class="section-heading"><h2 id="import-title">导入 LaTeX</h2><button id="close-import" aria-label="关闭导入">×</button></div><label for="latex-input">粘贴公式源码，点击应用后替换当前公式。</label><textarea id="latex-input" spellcheck="false" placeholder="例如：\frac{x+1}{x-1}" maxlength="10000"></textarea><div class="import-bottom"><p id="import-error" role="alert"></p><button id="apply-import" class="primary">应用到编辑器</button></div></section>
  <footer><span>拖拽构建 · 自由编辑 · 复制即用</span><span>本地处理，刷新后内容不保留</span></footer>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</main><script type="module" src="/src/main.ts"></script></body></html>
